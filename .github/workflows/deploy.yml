name: Deploy selected pins
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  select:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      sequence: ${{ steps.release.outputs.sequence }}
      published_at: ${{ steps.release.outputs.published_at }}
      expires_at: ${{ steps.release.outputs.expires_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Select immutable release identity and check prerequisites
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          IOTA_RELEASE_SIGNING_KEY: ${{ secrets.IOTA_RELEASE_SIGNING_KEY }}
          IOTA_RELEASE_PUBLIC_KEY: ${{ vars.IOTA_RELEASE_PUBLIC_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/select-release.sh

  build:
    needs: select
    if: needs.select.outputs.publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            target: desktop
            artifact: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            target: desktop
            artifact: aarch64-linux
          - runner: ubuntu-24.04
            system: x86_64-linux
            target: android
            artifact: android
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    environment: ${{ inputs.channel }}
    env:
      RELEASE_TAG: ${{ needs.select.outputs.tag }}
      RELEASE_SEQUENCE: ${{ needs.select.outputs.sequence }}
      PUBLISHED_AT: ${{ needs.select.outputs.published_at }}
      EXPIRES_AT: ${{ needs.select.outputs.expires_at }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Resolve Android cache keys
        if: matrix.target == 'android'
        id: android-cache
        continue-on-error: true
        run: |
          toolchain=$(nix eval --impure --no-update-lock-file --raw --expr \
            '(import ./packages/release-environment.nix { root = toString ./.; kind = "tauri"; }).drvPath')
          client=$(nix eval --impure --no-update-lock-file --raw --expr \
            '(builtins.getFlake (toString ./.)).inputs.client.outPath')
          gradle=$(cd "$client/apps/tauri/src-tauri"
            {
              printf '%s\0' Cargo.lock
              find gen/android -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.properties' -o -name '*.toml' -o -name 'gradle-wrapper.jar' \) -print0
            } | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)
          cargo=$(sha256sum "$client/apps/tauri/src-tauri/Cargo.lock" | cut -d ' ' -f 1)
          {
            printf 'gradle=release-gradle-v2-%s\n' "$gradle"
            printf 'rust=release-android-rust-v2-%s-%s\n' "${toolchain##*/}" "$cargo"
          } >> "$GITHUB_OUTPUT"
      - name: Cache Nix build outputs
        if: matrix.target == 'desktop'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        continue-on-error: true
        with:
          primary-key: release-nix-${{ matrix.artifact == 'x86_64-linux' && 'v3' || 'v2' }}-${{ matrix.artifact }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            release-nix-v3-${{ matrix.artifact }}-
            release-nix-v2-${{ matrix.artifact }}-
            release-nix-v1-${{ matrix.artifact }}-
          gc-max-store-size: 3G
      - name: Cache Gradle dependencies
        if: matrix.target == 'android'
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/release-gradle
          key: ${{ steps.android-cache.outputs.gradle || format('release-gradle-v1-{0}', hashFiles('flake.lock')) }}
          restore-keys: |
            release-gradle-v2-
            release-gradle-v1-
      - name: Cache Android Rust compilation
        if: steps.android-cache.outputs.rust != ''
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/release-sccache
          key: ${{ steps.android-cache.outputs.rust }}
          restore-keys: |
            release-android-rust-v2-
            release-android-rust-v1-
      - name: Build and verify ${{ matrix.artifact }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ matrix.target == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.target == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.target == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_STORE_PASSWORD: ${{ matrix.target == 'android' && secrets.ANDROID_STORE_PASSWORD || '' }}
          RELEASE_GRADLE_CACHE: ${{ matrix.target == 'android' && format('{0}/release-gradle', runner.temp) || '' }}
          RELEASE_RUST_CACHE: ${{ steps.android-cache.outputs.rust != '' && format('{0}/release-sccache', runner.temp) || '' }}
          RELEASE_SYSTEM: ${{ matrix.system }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          if [[ -n $RELEASE_RUST_CACHE ]] && compiler_cache=$(nix build --impure --no-update-lock-file --no-link --print-out-paths --expr \
            '(builtins.getAttr builtins.currentSystem (builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages).sccache'); then
            export RUSTC_WRAPPER="$compiler_cache/bin/sccache" CARGO_INCREMENTAL=0
            export SCCACHE_DIR="$RELEASE_RUST_CACHE" SCCACHE_CACHE_SIZE=2500M SCCACHE_IGNORE_SERVER_IO_ERROR=1
            trap '"$RUSTC_WRAPPER" --stop-server || true' EXIT
          fi
          builder=$(nix build --impure --no-update-lock-file --no-link --print-out-paths --expr \
            "import $PWD/packages/release-environment.nix { root = builtins.toPath \"$PWD\"; kind = \"build\"; system = \"$RELEASE_SYSTEM\"; }")
          bash "$builder" "$CHANNEL" build-output "$RELEASE_SYSTEM" "$RELEASE_TARGET"
          git diff --exit-code -- flake.lock
      - name: Sign Iota update metadata and validate installers
        if: matrix.target == 'desktop'
        env:
          IOTA_RELEASE_SIGNING_KEY: ${{ secrets.IOTA_RELEASE_SIGNING_KEY }}
          IOTA_RELEASE_PUBLIC_KEY: ${{ vars.IOTA_RELEASE_PUBLIC_KEY }}
          RELEASE_SYSTEM: ${{ matrix.system }}
        run: nix develop --no-write-lock-file --command bash scripts/sign-release.sh
      - name: Stage signed Android installer
        if: matrix.target == 'android'
        run: |
          test -s "build-output/Tensamin-$RELEASE_TAG.apk"
          install -Dm644 "build-output/Tensamin-$RELEASE_TAG.apk" release/Tensamin.apk
          find "$RUNNER_TEMP/release-gradle" -type f \( -name '*.lock' -o -name gc.properties \) -delete
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        if: matrix.artifact == 'x86_64-linux'
        with:
          name: channel-web
          path: build-output/client-web.tar.gz
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: [select, build]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.select.outputs.publish == 'false')) }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Restore x86_64 Nix build outputs
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        continue-on-error: true
        with:
          primary-key: release-nix-v3-x86_64-linux-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            release-nix-v3-x86_64-linux-
            release-nix-v2-x86_64-linux-
            release-nix-v1-x86_64-linux-
          save: false
      - name: Select tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p deployment
          if [[ $CHANNEL == stable ]]; then
            CANARY_RUN_ID=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/canary.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f status=success -f branch=main \
              --jq '.workflow_runs | map(select(.head_sha == "'"$GITHUB_SHA"'" and .conclusion == "success")) | sort_by(.updated_at) | last | .id // empty')
            [[ $CANARY_RUN_ID =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANARY_RUN_ID" > deployment/run.json
            jq -e --arg sha "$GITHUB_SHA" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/canary.yml"' deployment/run.json
            gh run download "$CANARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name canary-deployment --dir deployment
            jq -e --arg sha "$GITHUB_SHA" '.pins == $sha' deployment/manifest.json
          fi
          echo "PINS_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: nonanium/NixOS-Flake
          ref: main
          token: ${{ secrets.INFRASTRUCTURE_TOKEN }}
          path: infrastructure
          fetch-depth: 0
          persist-credentials: false
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:tensamin-deploy
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n $DEPLOY_SSH_KEY && -n $KNOWN_HOSTS ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            IdentityFile ~/.ssh/deploy
          EOF
      - name: Resolve, validate, push and deploy selected channel
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_TOKEN }}
          NIX_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The infrastructure PAT is only for its checkout/push. Source fetches
          # use this repository's native token, accepted by TensaminDev's policy.
          export NIX_CONFIG="access-tokens = github.com=$NIX_GITHUB_TOKEN"
          bash scripts/deploy.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.channel }}-deployment
          path: deployment/manifest.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
      - name: Remove credentials
        if: always()
        run: rm -f ~/.ssh/deploy ~/.ssh/config

  web:
    needs: [select, build, deploy]
    if: needs.select.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: channel-web
          path: web-artifact
      - name: Prepare static-only Pages deployment
        run: |
          mkdir web
          tar -xzf web-artifact/client-web.tar.gz -C web
          chmod -R u+w web
          python3 scripts/prepare-pages.py
      - name: Create the channel's free Pages project if needed
        env:
          CHANNEL: ${{ inputs.channel }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/create-pages-project.py
      - name: Deploy static web app to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.93.0'
          command: pages deploy web --project-name=tensamin-${{ inputs.channel }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

  publish:
    needs: [select, build, deploy, web]
    if: needs.select.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish immutable release and advance channel metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
          RELEASE_SEQUENCE: ${{ needs.select.outputs.sequence }}
          IOTA_RELEASE_PUBLIC_KEY: ${{ vars.IOTA_RELEASE_PUBLIC_KEY }}
        run: bash scripts/publish-release.sh
